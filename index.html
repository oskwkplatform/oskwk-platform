<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OSKWK Platform · 自然之息</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505; --surface: #0a0a0a; --surface2: #111;
      --text: #f0f0f0; --text2: #a8a8a8; --text3: #606060;
      --border: rgba(255,255,255,0.06); --border-light: rgba(255,255,255,0.12);
      --accent: #c9a87c; --danger: #e76f51; --success: #2a9d8f;
      --radius: 16px; --radius-sm: 10px; --radius-full: 9999px;
      --glass-bg: rgba(10,10,10,0.7); --glass-border: rgba(255,255,255,0.08);
      --blur: 24px; --font-size: 16px;
    }
    [data-theme="light"] {
      --bg: #f5f2ed; --surface: #fff; --surface2: #ebe5db;
      --text: #1a1a1a; --text2: #555; --text3: #999;
      --border: rgba(0,0,0,0.06); --border-light: rgba(0,0,0,0.1);
      --glass-bg: rgba(255,255,255,0.7); --glass-border: rgba(0,0,0,0.08);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;font-size:var(--font-size)}
    body{background:var(--bg);overflow-x:hidden}
    ::selection{background:var(--accent);color:#111}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

    #loader{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .5s}
    #loader.done{opacity:0;pointer-events:none}
    .loader-ring{width:44px;height:44px;border:2px solid var(--border-light);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    #app{display:none;opacity:0;transition:opacity .5s}
    #app.on{display:block;opacity:1}

    .auth-overlay{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 50% 30%, rgba(201,168,124,.15), var(--bg) 80%);backdrop-filter:blur(30px);display:flex;align-items:center;justify-content:center;padding:20px}
    .auth-card{background:var(--glass-bg);backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);border-radius:var(--radius);padding:40px 32px;max-width:420px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.6);animation:authIn .5s ease}
    @keyframes authIn{from{opacity:0;transform:translateY(20px) scale(.98)}}
    .auth-card h2{font-family:'Playfair Display',serif;font-size:2rem;margin-bottom:28px;text-align:center}
    .auth-card input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;color:var(--text);font-size:.9rem;width:100%;margin-bottom:14px;outline:none}
    .auth-card input:focus{border-color:var(--accent)}
    .auth-btn{width:100%;padding:14px;border-radius:var(--radius-full);background:var(--accent);color:#111;font-weight:600;font-size:.95rem;border:none;cursor:pointer}
    .auth-link{margin-top:20px;text-align:center;font-size:.85rem;color:var(--text3)}
    .auth-link a{color:var(--accent);cursor:pointer;font-weight:500}

    .nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;background:var(--glass-bg);backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--glass-border);display:flex;align-items:center;padding:0 24px}
    .nav-logo{cursor:pointer;display:flex;align-items:center}
    .nav-logo svg{width:28px;height:28px;stroke:var(--accent)}
    .nav-icons{display:flex;gap:2px;margin:0 auto}
    .nav-icon{background:none;border:none;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;color:var(--text2);transition:.2s;position:relative}
    .nav-icon svg{width:20px;height:20px;stroke:currentColor}
    .nav-icon:hover{color:var(--text);background:rgba(255,255,255,.05)}
    .nav-icon.active{color:var(--accent);background:rgba(255,255,255,.03)}
    .nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
    .badge{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--danger);border-radius:50%;display:none}
    .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#050505;font-weight:600;cursor:pointer;font-size:.8rem;border:1.5px solid var(--border-light)}

    .mob-nav{position:fixed;bottom:0;left:0;right:0;background:var(--glass-bg);backdrop-filter:blur(var(--blur));border-top:1px solid var(--glass-border);display:none;justify-content:space-around;padding:8px 0;z-index:100}
    .mob-nav .nav-icon{flex-direction:column;gap:2px;width:auto;height:auto;padding:6px 10px;font-size:.55rem;color:var(--text3)}
    .mob-nav .nav-icon svg{width:22px;height:22px}
    .mob-nav .nav-icon.active{color:var(--accent)}

    .hero{position:relative;height:100vh;min-height:650px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;margin-top:-64px}
    .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.45)}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 8%,transparent 55%);z-index:2}
    .hero-caption{position:relative;z-index:3;text-align:center;padding:0 24px 100px;will-change:transform,opacity}
    .hero-caption h1{font-family:'Playfair Display',serif;font-size:clamp(3rem,8vw,6rem);font-weight:900;color:#fff;text-shadow:0 4px 60px rgba(0,0,0,.7)}
    .hero-caption p{color:rgba(255,255,255,.55);font-size:1rem;font-weight:300;margin-top:8px}

    .main-wrap{max-width:1200px;margin:0 auto;padding:40px 24px 120px}
    .page{display:none;animation:fadeIn .35s ease}
    .page.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}

    .sec-title{display:flex;align-items:center;gap:12px;margin-bottom:28px;font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700}
    .sec-title::after{content:'';flex:1;height:1px;background:var(--border-light)}

    .grid{columns:3 280px;column-gap:20px}
    .card{break-inside:avoid;margin-bottom:20px;border-radius:var(--radius);overflow:hidden;background:var(--surface2);border:1px solid var(--border);transition:.3s;cursor:pointer;position:relative}
    .card:hover{transform:translateY(-3px);border-color:var(--accent)}
    .card img{width:100%;display:block;background:var(--surface)}
    .card-body{padding:18px}
    .card-body h3{font-size:1rem;font-weight:600;margin-bottom:6px}
    .card-delete{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;opacity:0;transition:opacity .2s}
    .card:hover .card-delete{opacity:1}

    .chat-box{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;height:65vh;display:flex;flex-direction:column}
    .chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
    .msg{max-width:78%;padding:10px 14px;border-radius:18px;font-size:.88rem;word-break:break-word}
    .msg.mine{background:var(--accent);color:#111;align-self:flex-end;border-bottom-right-radius:5px}
    .msg.peer{background:var(--surface2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:5px}
    .msg img{max-width:180px;border-radius:8px;margin-top:6px}
    .chat-bar{display:flex;padding:12px;gap:8px;border-top:1px solid var(--border)}
    .chat-bar input{flex:1;padding:12px 16px;border-radius:var(--radius-full);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:.88rem;outline:none}
    .chat-bar button{background:var(--accent);border:none;border-radius:var(--radius-full);padding:0 16px;cursor:pointer;color:#111;font-weight:600}

    .settings{position:fixed;top:80px;right:24px;width:280px;background:var(--glass-bg);backdrop-filter:blur(40px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:24px;z-index:200;display:none;flex-direction:column;gap:20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
    .settings.show{display:flex}
    .theme-btn{padding:6px 16px;border-radius:var(--radius-full);background:var(--surface2);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:.8rem}
    .theme-btn.active{background:var(--accent);border-color:var(--accent);color:#111}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
    .modal.show{display:flex}
    .modal-box{background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);padding:32px;max-width:440px;width:100%;animation:modalIn .3s;max-height:90vh;overflow-y:auto}
    @keyframes modalIn{from{opacity:0;transform:scale(.95)}}
    input,textarea{width:100%;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:.9rem;margin-bottom:14px;outline:none}
    input:focus,textarea:focus{border-color:var(--accent)}
    button.main{background:var(--accent);border:none;color:#111;font-weight:600;padding:14px 28px;border-radius:var(--radius-full);cursor:pointer;width:100%;font-size:.9rem}

    @media(max-width:768px){.nav-icons{display:none}.mob-nav{display:flex}.hero h1{font-size:2.8rem}.main-wrap{padding:24px 16px 100px}.grid{columns:1}}
  </style>
</head>
<body>
<div id="loader"><div class="loader-ring"></div></div>

<!-- 登录/注册 -->
<div id="authWrap" class="auth-overlay">
  <div class="auth-card" id="loginBox">
    <h2>OSKWK Platform</h2>
    <input type="email" id="loginEmail" placeholder="邮箱" autocomplete="email">
    <input type="password" id="loginPass" placeholder="密码">
    <button class="auth-btn" id="loginBtn">登 录</button>
    <p id="loginHint" style="font-size:.8rem;color:var(--danger);margin-top:8px;text-align:center;"></p>
    <div class="auth-link">还没有账户？ <a onclick="showReg()">创建账户</a></div>
  </div>
  <div class="auth-card" id="regBox" style="display:none">
    <h2>加入 OSKWK</h2>
    <input id="regPhone" placeholder="手机号" type="tel">
    <input id="regEmail" placeholder="邮箱" type="email">
    <div style="display:flex;gap:8px"><input id="regCode" placeholder="验证码" style="flex:1"><button onclick="sendCode()" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 16px;cursor:pointer">获取</button></div>
    <input id="regPass" type="password" placeholder="密码">
    <input id="regNick" placeholder="昵称">
    <label style="display:flex;gap:8px;font-size:.8rem;color:var(--text2);margin:10px 0"><input type="checkbox" id="regAgree">同意协议</label>
    <button class="auth-btn" id="regBtn">注 册</button>
    <div class="auth-link">已有账户？ <a onclick="showLogin()">返回登录</a></div>
  </div>
</div>

<!-- 主应用 -->
<div id="app">
  <nav class="nav">
    <div class="nav-logo" onclick="switchTab('about')">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="4" ry="10" stroke="currentColor" stroke-width="1.5"/><path d="M2 12h20" stroke="currentColor" stroke-width="1.5"/></svg>

    <div class="nav-icons">
      <button class="nav-icon active" data-tab="about" onclick="switchTab('about')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/><circle cx="12" cy="12" r="9" stroke-dasharray="4 4"/></svg></button>

  <div class="settings" id="settingsPanel">

        </div>

window.switchTab = async tab => {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const page=$('#tab-'+tab); if(page) page.classList.add('active');
  document.querySelectorAll('.nav-icon[data-tab], .mob-nav .nav-icon[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  window.scrollTo({top:0,behavior:'smooth'});
  if(tab==='about') { loadArticles('about'); updateAdminBar('about'); }
  if(tab==='discover') { loadArticles('discover'); updateAdminBar('discover'); }
  if(tab==='study') { loadArticles('study'); updateAdminBar('study'); }

function updateAdminBar(cat){
  const bar = document.getElementById('adminBar'+cat.charAt(0).toUpperCase()+cat.slice(1));
  if(bar) bar.style.display = isAdmin ? 'flex' : 'none';
}

async function loadArticles(cat){
  const c=$('#article-'+cat); if(!c) return;
  const {data} = await supabase.from('articles').select('*').eq('category',cat).order('created_at',{ascending:false});
  c.innerHTML = (data||[]).map(a=>`
    <div class="card" onclick="${isAdmin?'':`expandArticle(${a.id})`}" style="${isAdmin?'cursor:default':''}">
      ${isAdmin ? `<button class="card-delete" onclick="event.stopPropagation();deleteArticle(${a.id},'${cat}')">×</button>` : ''}
      <img src="${a.image_url||landscape()}" loading="lazy" onerror="this.src='${landscape()}'">
      <div class="card-body"><h3>${a.title}</h3><p>${a.content?.slice(0,100)||''}</p></div>
    </div>
  `).join('')||'<p style="color:var(--text3)">暂无内容</p>';
}

window.deleteArticle = async (id,cat) => {

// 文章详情
window.expandArticle = async id => {
  try {
    const {data:a,error} = await supabase.from('articles').select('*').eq('id',id).single();
    if(error||!a) return T('文章加载失败');
    let html=`<h2>${a.title}</h2><img src="${a.image_url||landscape()}" style="width:100%;border-radius:8px;margin:12px 0"><p>${a.content}</p><hr><h4>评论</h4>`;
    const {data:coms} = await supabase.from('comments').select('*').eq('article_id',id).order('created_at');
    html+=(coms||[]).map(c=>`<p><b>${c.nickname}:</b> ${c.content}</p>`).join('');

window.postComment = async id => {

  await supabase.from('comments').insert([{article_id:id, nickname:user.nickname, content:inp.value.trim()}]);

};

// ---- 聊天增强 ----
let allRooms = [];
async function renderRoomList() {
  $('#chatPanel').style.display='none';
  $('#roomList').style.display='flex';
  // 加载房间
  const {data} = await supabase.from('rooms').select('*').order('created_at',{ascending:false});
  allRooms = data || [];
  filterRooms();
  // 搜索框绑定事件
  $('#roomSearch').oninput = filterRooms;
}
function filterRooms(){
  const kw = $('#roomSearch').value.trim().toLowerCase();
  const list = $('#roomList');
  let html = '';
  // 默认公共房间
  const publicRooms = ['大厅','技术','理论','艺术'];
  for(const name of publicRooms){
    if(!kw || name.includes(kw)){
      html += `<button class="nav-icon" style="width:auto;padding:8px 16px" onclick="joinPublicRoom('${name}')"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> ${name}</button>`;
    }
  }
  // 自定义房间
  for(const r of allRooms){
    if(!kw || r.name.toLowerCase().includes(kw)){
      html += `<button class="nav-icon" style="width:auto;padding:8px 16px" onclick="joinCustomRoom('${r.name.replace(/'/g,"\\'")}', '${r.password?1:0}')"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg> ${r.name}${r.password?' 🔒':''}</button>`;
    }
  }
  html += `<button class="nav-icon" style="width:auto;padding:8px 16px" onclick="startPrivateChat()"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg> 私信</button>`;
  list.innerHTML = html || '<p style="color:var(--text3)">没有匹配的房间</p>';
}

window.showCreateRoom = () => {
  let html = `<h3>创建房间</h3><input id="newRoomName" placeholder="房间名称"><input id="newRoomPass" type="password" placeholder="密码（可选）"><button class="main" onclick="createRoom()">创建</button>`;
  $('#genericContent').innerHTML = html;
  $('#genericModal').classList.add('show');
};
window.createRoom = async () => {
  const name = $('#newRoomName')?.value.trim(), pass = $('#newRoomPass')?.value.trim();
  if(!name) return T('请输入房间名称');
  if(['大厅','技术','理论','艺术'].includes(name)) return T('不能与公共房间重名');
  const {error} = await supabase.from('rooms').insert([{name, password:pass||'', created_by:user.email}]);
  if(error) return T('创建失败');
  T('房间已创建');
  $('#genericModal').classList.remove('show');
  renderRoomList();
};

window.joinPublicRoom = name => { if(!user) return T('请登录'); room='oskwk-'+name; startChat(); };
window.joinCustomRoom = (name, hasPass) => {
  if(!user) return T('请登录');
  if(hasPass){
    let pass = prompt('请输入房间密码：');
    if(pass === null) return;
    // 简单验证（直接通过 rooms 表检查）
    supabase.from('rooms').select('password').eq('name',name).single().then(({data})=>{
      if(data && data.password === pass){
        room = 'oskwk-'+name;
        startChat();
      } else {
        T('密码错误');
      }
    });
  } else {
    room = 'oskwk-'+name;
    startChat();
  }
};

window.startPrivateChat = () => {
  if(!user) return T('请先登录');
  const peer = prompt('对方邮箱');
  if(!peer) return;
  room = 'private-'+[user.email,peer].sort().join('_');
  startChat();
};

async function startChat(){
  $('#roomList').style.display='none';
  $('#chatPanel').style.display='block';
  $('#chatLog').innerHTML='';
  const {data} = await supabase.from('messages').select('*').eq('room',room).order('created_at',{ascending:true}).limit(50);
  data?.forEach(renderMsg);
  if(realtime) supabase.removeChannel(realtime);
  realtime = supabase.channel('room-'+room)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`room=eq.${room}`},payload=>renderMsg(payload.new))
    .subscribe((status, err) => {
      if (status === 'SUBSCRIBED') console.log('实时聊天已连接');
      if (status === 'CHANNEL_ERROR') console.error(err);
    });
}
function renderMsg(m){
  const log=$('#chatLog'); if(!log) return;
  const div=document.createElement('div'); div.className='msg '+(m.nickname===user?.nickname?'mine':'peer');
  div.innerHTML=`<b>${m.nickname}</b><br>${m.message||''}${m.image_url?`<br><img src="${m.image_url}">`:''}`;
  log.appendChild(div); log.scrollTop=log.scrollHeight;
}
window.sendMsg = async () => {
  const inp=$('#msgInput'), txt=inp.value.trim();
  if(!user) return T('请先登录');
  if(!room) return T('请先进入聊天室');
  if(!txt) return;
  try {
    const {error} = await supabase.from('messages').insert([{room, nickname:user.nickname, message:txt}]);
    if(error) throw error;
    renderMsg({room, nickname:user.nickname, message:txt, created_at:new Date().toISOString()});
    inp.value='';
  } catch(e){ T('发送失败'); }
};
window.uploadImg = async () => {
  const f=$('#imgUpload').files[0];
  if(!user) return T('请先登录'); if(!room) return T('请先进入聊天室'); if(!f) return;
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),img=new Image(); img.src=URL.createObjectURL(f);
  await new Promise(r=>img.onload=r); let w=img.width,h=img.height; if(w>800){h*=800/w;w=800;} canvas.width=w;canvas.height=h; ctx.drawImage(img,0,0,w,h);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.7));
  const name=`chat_${Date.now()}.jpg`;
  const {error:uploadError} = await supabase.storage.from('chat-images').upload(name,blob);
  if(uploadError) return T('图片上传失败');
  const url=`${SUPABASE_URL}/storage/v1/object/public/chat-images/${name}`;
  await supabase.from('messages').insert([{room, nickname:user.nickname, image_url:url}]);
  renderMsg({room, nickname:user.nickname, message:'', image_url:url, created_at:new Date().toISOString()});
  $('#imgUpload').value='';
};
window.leaveRoom = () => {
  if(realtime) supabase.removeChannel(realtime);
  room=null; $('#chatPanel').style.display='none'; renderRoomList();
};

// 动态/好友
window.openPost = () => {
  $('#genericContent').innerHTML = `<textarea id="postText" placeholder="分享风景..."></textarea><input type="file" id="postFile" accept="image/*"><button class="main" onclick="submitPost()">发布</button>`;
  $('#genericModal').classList.add('show');
};
window.submitPost = async () => {
  const txt=$('#postText')?.value.trim(), file=$('#postFile')?.files[0]; let url=null;
  if(file){
    const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),img=new Image(); img.src=URL.createObjectURL(file);
    await new Promise(r=>img.onload=r); let w=img.width,h=img.height; if(w>800){h*=800/w;w=800;} canvas.width=w;canvas.height=h; ctx.drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.7));
    const name=`post_${Date.now()}.jpg`; await supabase.storage.from('chat-images').upload(name,blob);
    url=`${SUPABASE_URL}/storage/v1/object/public/chat-images/${name}`;
  }
  await supabase.from('posts').insert([{email:user.email, nickname:user.nickname, content:txt||'', image_url:url}]);
  T('已发布'); $('#genericModal').classList.remove('show'); loadFeed();
};
async function loadFeed(){
  if(!user) return;
  const {data:friends} = await supabase.from('friendships').select('*').or(`from_email.eq.${user.email},to_email.eq.${user.email}`).eq('status','accepted');
  const emails=[user.email,...(friends||[]).map(f=>f.from_email===user.email?f.to_email:f.from_email)];
  const {data:posts} = await supabase.from('posts').select('*').in('email',emails).order('created_at',{ascending:false}).limit(30);
  $('#friendsFeed').innerHTML = (posts||[]).map(p=>`<div class="card"><div class="card-body"><b>${p.nickname}</b> ${p.content||''}</div>${p.image_url?`<img src="${p.image_url}" style="width:100%">`:''}</div>`).join('')||'<p style="color:var(--text3)">暂无动态</p>';
}
window.showRequests = async () => {
  const {data} = await supabase.from('friendships').select('*').eq('to_email',user.email).eq('status','pending');
  let html='<h3>好友请求</h3>';
  if(data?.length) data.forEach(r=>html+=`<p>${r.from_email} <button onclick="handleReq(${r.id},'accepted')">接受</button> <button onclick="handleReq(${r.id},'rejected')">拒绝</button></p>`);
  else html+='<p>暂无</p>';
  $('#genericContent').innerHTML=html; $('#genericModal').classList.add('show');
};
window.handleReq = async (id,status) => { await supabase.from('friendships').update({status}).eq('id',id); T('已处理'); window.showRequests(); };
window.addFriend = () => { const email=prompt('对方邮箱'); if(email) supabase.from('friendships').insert([{from_email:user.email,to_email:email}]).then(()=>T('已发送')); };

// 个人中心&管理员
async function renderProfile(){
  if(!user) return;
  let html=`<div class="card" style="text-align:center;padding:24px"><div class="avatar" style="width:56px;height:56px;font-size:1.4rem;margin:0 auto 16px">${user.nickname?.charAt(0)}</div><h3>${user.nickname}</h3><p>${user.email}</p><button onclick="showRequests()">好友请求</button> <button onclick="addFriend()">添加好友</button>`;
  if(isAdmin) html+='<button onclick="showAdmin()">用户管理</button>';
  html+='<button onclick="logout()">退出</button></div>';
  $('#profileArea').innerHTML=html;
}
window.showAdmin = async () => {
  if(!isAdmin) return T('无权操作');
  const {data} = await supabase.from('profiles').select('*');
  let html='<h3>用户管理</h3>';
  data.forEach(u=>html+=`<p>${u.nickname} (${u.email}) ${u.is_banned?'[BANNED]':''} <button onclick="toggleBan('${u.email}',${!u.is_banned})">${u.is_banned?'解禁':'拉黑'}</button></p>`);
  $('#genericContent').innerHTML=html; $('#genericModal').classList.add('show');
};
window.toggleBan = async (email,ban) => { if(!isAdmin) return; await supabase.from('profiles').update({is_banned:ban}).eq('email',email); T('已更新'); window.showAdmin(); };

// 通知
async function fetchNotifs(){
  if(!user) return;
  const {data} = await supabase.from('notifications').select('*').eq('user_email',user.email).order('created_at',{ascending:false}).limit(20);
  const unread=data?.filter(n=>!n.read).length||0;
  const dot=$('#notifDot'); if(dot) dot.style.display=unread?'block':'none';
  return data;
}
window.showNotifs = async () => {
  const data=await fetchNotifs();
  let html='<h3>通知</h3>';
  if(data?.length) data.forEach(n=>html+=`<p>${n.content} <small>${new Date(n.created_at).toLocaleString()}</small></p>`);
  else html+='<p>暂无</p>';
  $('#genericContent').innerHTML=html; $('#genericModal').classList.add('show');
  await supabase.from('notifications').update({read:true}).eq('user_email',user.email).eq('read',false);
};
function subNotifs(){
  if(!user) return;
  if(notifSub) supabase.removeChannel(notifSub);
  notifSub = supabase.channel('notif-'+user.email).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_email=eq.${user.email}`},()=>fetchNotifs()).subscribe();
}

// 登录注册（安全 bcrypt）
window.doLogin = async () => {
  const email=$('#loginEmail').value.trim(), pwd=$('#loginPass').value.trim();
  if(!email||!pwd) return T('请输入邮箱和密码');
  const { data, error } = await supabase.rpc('verify_login', { user_email: email, user_password: pwd });
  if (error || !data || data.length === 0) return T('邮箱或密码错误');
  user = data[0];
  isAdmin = (user.email === ADMIN_EMAIL);
  localStorage.setItem('oskwk_user', JSON.stringify(user));
  enter();
};
window.doRegister = async () => {
  const email=$('#regEmail').value.trim(), phone=$('#regPhone').value.trim(), code=$('#regCode').value.trim(), pwd=$('#regPass').value.trim(), nick=$('#regNick').value.trim();
  if(!email||!phone||!pwd||!nick) return T('请填写完整');
  if(code!=='123456') return T('验证码错误');
  const { data, error } = await supabase.rpc('register_user', { user_email: email, user_nickname: nick, user_phone: phone, user_password: pwd });
  if (error) return T('注册失败');
  user = data[0];
  isAdmin = false;
  localStorage.setItem('oskwk_user', JSON.stringify(user));
  enter();
};
function enter(){
  document.getElementById('authWrap').style.display='none';
  document.getElementById('app').classList.add('on');
  document.getElementById('avatarTxt').textContent = user?.nickname?.charAt(0)?.toUpperCase() || '?';
  subNotifs();
  fetchNotifs();
  switchTab('about');
}
window.logout = () => { localStorage.removeItem('oskwk_user'); location.reload(); };
window.showReg = () => { $('#loginBox').style.display='none'; $('#regBox').style.display='block'; };
window.showLogin = () => { $('#loginBox').style.display='block'; $('#regBox').style.display='none'; };
window.sendCode = () => T('验证码：123456');

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('regBtn').addEventListener('click', doRegister);

// 自动登录
(()=>{
  const saved = localStorage.getItem('oskwk_user');
  if (saved) {
    try {
      user = JSON.parse(saved);
      isAdmin = (user.email === ADMIN_EMAIL);
      enter();
    } catch(e){ localStorage.removeItem('oskwk_user'); }
  } else {
    document.getElementById('authWrap').style.display = 'flex';
  }
  setTimeout(() => $('#loader').classList.add('done'), 500);
})();
</script>
