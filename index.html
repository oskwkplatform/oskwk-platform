<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OSKWK Platform · 自然之息</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: rgba(255,255,255,0.72);
      --surface2: rgba(240,240,245,0.8);
      --text: #1d1d1f;
      --text2: #86868b;
      --text3: #aeaeb2;
      --border: rgba(0,0,0,0.06);
      --border-light: rgba(0,0,0,0.1);
      --accent: #0071e3;
      --danger: #ff3b30;
      --success: #34c759;
      --radius: 24px;
      --radius-sm: 14px;
      --radius-full: 9999px;
      --glass-bg: rgba(255,255,255,0.6);
      --glass-border: rgba(0,0,0,0.08);
      --blur: 30px;
      --font-size: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.08);
      --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
    }
    [data-theme="dark"] {
      --bg: #1c1c1e;
      --surface: rgba(44,44,46,0.75);
      --surface2: rgba(58,58,60,0.8);
      --text: #f5f5f7;
      --text2: #a1a1a6;
      --text3: #6e6e73;
      --border: rgba(255,255,255,0.08);
      --border-light: rgba(255,255,255,0.12);
      --glass-bg: rgba(28,28,30,0.65);
      --glass-border: rgba(255,255,255,0.1);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.4);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;font-size:var(--font-size);transition: background 0.5s}
    body{background:var(--bg);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;transition: background 0.5s}
    ::selection{background:var(--accent);color:#fff}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px}

    /* 动态光晕背景 */
    .bg-animation {
      position: fixed; inset: 0; z-index: -1; opacity: 0.6;
      background: radial-gradient(ellipse at 50% 0%, rgba(0,113,227,0.15), transparent 70%),
                  radial-gradient(ellipse at 80% 100%, rgba(255,69,58,0.1), transparent 70%);
      animation: bgPulse 10s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      0% { opacity: 0.4; transform: scale(1); }
      100% { opacity: 0.7; transform: scale(1.05); }
    }

    #loader{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .5s}
    #loader.done{opacity:0;pointer-events:none}
    .loader-ring{width:32px;height:32px;border:3px solid var(--border-light);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    #app{width:100%;display:none;opacity:0;transition:opacity .6s}
    #app.on{display:block;opacity:1}

    /* macOS 风格登录卡 */
    .auth-overlay{
      position:fixed;inset:0;z-index:1000;
      background: var(--bg);
      display:flex;align-items:center;justify-content:center;padding:20px;
      backdrop-filter: blur(20px);
      transition: all 0.5s;
    }
    .auth-card{
      background: var(--surface);
      backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
      border:1px solid var(--glass-border); border-radius:32px;
      padding:48px 40px; max-width:400px; width:100%;
      box-shadow: var(--shadow-md);
      text-align:center;
      animation: floatIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .auth-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .auth-card h2{
      font-family:'Playfair Display',serif; font-size:2.5rem;
      margin-bottom:8px; color:var(--text); letter-spacing:1px;
    }
    .auth-card .subtitle { font-size: 0.95rem; color: var(--text2); margin-bottom: 32px; }
    .input-group { position: relative; margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; font-size: 0.8rem; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
    .auth-card input{
      background:var(--surface2); border:1px solid var(--border); border-radius:14px;
      padding:14px 18px; color:var(--text); font-size:0.95rem; width:100%;
      outline:none; transition:border 0.2s, box-shadow 0.2s;
    }
    .auth-card input:focus{
      border-color:var(--accent);
      box-shadow: 0 0 0 3px rgba(0,113,227,0.2);
    }
    .auth-card input.error { border-color: var(--danger); }
    .input-hint { font-size: 0.75rem; color: var(--danger); margin-top: 4px; display: none; }
    .input-hint.show { display: block; }
    .auth-btn{
      width:100%; padding:16px; border-radius:14px;
      background: var(--accent); color:#fff; font-weight:600; font-size:1rem; border:none; cursor:pointer;
      margin-top:12px; transition:all 0.2s; letter-spacing:0.5px;
      box-shadow: 0 4px 12px rgba(0,113,227,0.3);
      position: relative; overflow: hidden;
    }
    .auth-btn:hover{transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,113,227,0.4);}
    .auth-btn:active{transform: scale(0.98);}
    .auth-btn.loading { pointer-events: none; opacity: 0.7; }
    .auth-btn.loading::after {
      content: ''; position: absolute; top:50%; left:50%; width:18px; height:18px;
      margin:-9px 0 0 -9px; border:2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius:50%; animation: spin 0.6s linear infinite;
    }
    .auth-link{margin-top:20px;color:var(--text2);font-size:0.9rem}
    .auth-link a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
    .agree-row{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--text2);margin:10px 0;text-align:left;}

    /* 导航栏 */
    .nav{
      position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;
      height:52px; max-width:680px; width:calc(100% - 32px);
      background:var(--glass-bg); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      border:1px solid var(--glass-border); border-radius: var(--radius-full);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px; transition: all 0.3s;
      box-shadow: var(--shadow-sm);
    }
    .nav.scrolled { background: var(--surface); box-shadow: var(--shadow-md); }
    .nav-logo{
      cursor:pointer;display:flex;align-items:center;gap:6px;
      font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--text); font-weight: 600;
      transition: color 0.2s;
    }
    .nav-logo:hover { color: var(--accent); }
    .nav-logo svg{width:26px;height:26px;stroke:currentColor}
    .nav-icons{display:flex;gap:2px}
    .nav-icon{
      background:none;border:none;width:38px;height:38px;display:flex;align-items:center;
      justify-content:center;border-radius: var(--radius-sm);cursor:pointer;color:var(--text2);
      transition: all 0.2s;position:relative;
    }
    .nav-icon svg{width:19px;height:19px;stroke:currentColor}
    .nav-icon:hover{color:var(--text);background:var(--surface2);}
    .nav-icon.active{color:var(--accent);background:rgba(0,113,227,0.1);}
    .nav-right{display:flex;align-items:center;gap:6px}
    .badge{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--danger);border-radius:50%;display:none}
    .avatar{
      width:34px;height:34px;border-radius:50%;background:var(--accent);
      display:flex;align-items:center;justify-content:center;color:#fff;
      font-weight:600;cursor:pointer;font-size:.8rem;border:2px solid var(--glass-border);
      background-size:cover;background-position:center;
      transition: transform 0.2s;
    }
    .avatar:hover { transform: scale(1.05); }

    /* 移动端底部导航 */
    .mob-nav{
      position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;
      background:var(--glass-bg); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      border:1px solid var(--glass-border); border-radius: var(--radius-full);
      display:none; justify-content:space-around; padding:8px 16px; gap:4px;
      box-shadow: var(--shadow-md);
    }
    .mob-nav .nav-icon{width:44px;height:44px}
    .mob-nav .nav-icon svg{width:22px;height:22px}

    /* 英雄区 */
    .hero{
      height:100vh;min-height:700px;display:flex;align-items:flex-end;
      justify-content:center;overflow:hidden;position:relative;
    }
    .hero-img{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      filter:brightness(0.55);will-change:transform; transition: filter 0.5s;
    }
    .hero-img-error {
      display:none;
      position:absolute;inset:0;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
    }
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 5%,transparent 60%);z-index:2}
    .hero-caption{
      position:relative;z-index:3;text-align:center;padding-bottom:120px;
      will-change:opacity,transform; animation: fadeInUp 0.8s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero-caption h1{
      font-family:'Playfair Display',serif; font-size:clamp(4rem,12vw,8rem);
      font-weight:900; color:#fff; text-shadow:0 8px 40px rgba(0,0,0,0.5);
      letter-spacing:4px;
    }
    .hero-caption p{color:rgba(255,255,255,0.8);font-size:1.2rem;font-weight:300;margin-top:12px;}

    .main-wrap{max-width:1200px;margin:0 auto;padding:60px 24px 140px;width:100%}
    .page{display:none;animation:fadePage 0.35s ease}
    .page.active{display:block}
    @keyframes fadePage{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .sec-title{
      font-family:'Playfair Display',serif;font-size:2rem;margin-bottom:32px;
      display:flex;align-items:center;gap:16px;
    }
    .sec-title::after{content:'';flex:1;height:1px;background:var(--border-light);}

    .grid{columns:3 300px;column-gap:24px}
    .card{
      break-inside:avoid;margin-bottom:24px;border-radius:var(--radius);overflow:hidden;
      background:var(--surface);border:1px solid var(--border);
      transition: all var(--transition);cursor:pointer;position:relative;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .card:hover{
      transform:translateY(-6px);border-color:var(--accent);
      box-shadow:var(--shadow-md);
    }
    .card-img-wrap {
      position: relative;
      width: 100%;
      background: var(--surface2);
    }
    .card img{
      width:100%;display:block;transition: transform 0.5s;
      background: var(--surface2);
    }
    .card:hover img{transform: scale(1.04)}
    .card-body{padding:20px}
    .card-body h3{font-size:1.2rem;font-weight:600;margin-bottom:6px}
    .card-delete{position:absolute;top:12px;right:12px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;opacity:0;transition:opacity 0.2s;z-index:2}
    .card:hover .card-delete{opacity:1}

    /* 聊天室 */
    .chat-box{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;height:65vh;display:flex;flex-direction:column}
    .chat-log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:78%;padding:12px 16px;border-radius:22px;font-size:.9rem;word-break:break-word;display:flex;gap:10px;align-items:flex-start;animation:msgPop 0.2s ease}
    @keyframes msgPop{from{opacity:0;transform:scale(0.95)}}
    .msg-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.75rem;color:#fff}
    .msg-body{display:flex;flex-direction:column}
    .msg-time{font-size:.7rem;color:var(--text3);margin-top:4px}
    .msg.mine{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:8px}
    .msg.peer{background:var(--surface2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:8px}
    .chat-bar{display:flex;padding:14px;gap:10px;border-top:1px solid var(--border)}
    .chat-bar input{flex:1;padding:12px 18px;border-radius:var(--radius-full);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:.9rem;outline:none}
    .chat-bar button{background:var(--accent);border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff; transition: transform 0.2s}
    .chat-bar button:hover{transform: scale(1.05);}

    /* 论坛 */
    .forum-post{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:24px;margin-bottom:24px;position:relative;transition: box-shadow 0.3s;cursor:pointer;}
    .forum-post:hover{box-shadow:var(--shadow-md)}
    .forum-post-header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
    .forum-post-avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:1rem}
    .forum-post-meta{flex:1}
    .forum-post-nickname{font-weight:600;font-size:1.05rem}
    .forum-post-time{font-size:.75rem;color:var(--text3)}
    .forum-post-content{margin-bottom:16px;line-height:1.6}
    .forum-post-image{max-width:100%;border-radius:16px;margin-top:8px;transition: transform 0.3s}
    .forum-post-image:hover{transform: scale(1.02)}
    .forum-post-delete{position:absolute;top:16px;right:16px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:30px;height:30px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:2}
    .forum-post:hover .forum-post-delete{display:flex}

    /* 评论区 */
    .forum-comments{margin-top:20px;border-top:1px solid var(--border);padding-top:20px}
    .forum-comment-item{display:flex;gap:10px;margin-bottom:14px}
    .forum-comment-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;font-size:.7rem}
    .forum-comment-body{flex:1}
    .forum-comment-meta{display:flex;gap:8px;align-items:baseline}
    .forum-comment-nickname{font-weight:600;font-size:.85rem}
    .forum-comment-time{font-size:.7rem;color:var(--text3)}
    .forum-comment-content{margin-top:4px;font-size:.9rem}
    .forum-comment-form{display:flex;gap:10px;margin-top:14px}
    .forum-comment-input{flex:1;padding:12px 18px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:.85rem;outline:none}
    .forum-comment-input:focus{border-color:var(--accent)}
    .forum-comment-btn{background:var(--accent);border:none;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:transform 0.2s}
    .forum-comment-btn:hover{transform:scale(1.1)}

    /* 设置面板 */
    .settings{
      position:fixed;top:100px;right:24px;width:320px;
      background:var(--glass-bg);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
      border:1px solid var(--glass-border);border-radius:var(--radius);padding:24px;
      z-index:200;display:none;flex-direction:column;gap:20px;
      box-shadow:var(--shadow-md); animation: fadeIn 0.2s ease;
    }
    .settings.show{display:flex}
    .theme-btn{
      padding:10px 20px;border-radius:var(--radius-full);background:var(--surface2);
      border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:.85rem;
      transition:all 0.2s;
    }
    .theme-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .theme-btn:hover{transform:scale(1.02)}

    /* 节日倒计时 */
    .countdown-widget {
      background: var(--surface); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 28px;
      margin-bottom: 32px; text-align: center;
    }
    .countdown-widget h3 { font-family:'Playfair Display',serif; font-size:1.5rem; margin-bottom:20px; color:var(--text); }
    .countdown-item { max-width: 300px; margin: 0 auto; }
    .countdown-item .days { font-size: 3rem; font-weight: 700; color: var(--accent); }
    .countdown-item .label { font-size: 1rem; color: var(--text2); margin-bottom: 16px; }
    .progress-bar-container { width: 100%; height: 6px; background: var(--border); border-radius: 6px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.4s; }

    .signature-box {
      margin-top: 14px; padding: 14px; background: var(--surface2);
      border-radius: var(--radius-sm); border: 1px solid var(--border);
      font-style: italic; color: var(--text2);
    }

    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,0.4);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      z-index:300;display:none;align-items:center;justify-content:center;padding:20px;
    }
    .modal.show{display:flex}
    .modal-box{
      background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);
      padding:36px;max-width:560px;width:100%;animation:modalPop 0.3s ease;max-height:90vh;overflow-y:auto;
    }
    @keyframes modalPop{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
    input,textarea{
      width:100%;padding:14px 18px;background:var(--surface2);border:1px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);font-size:.9rem;margin-bottom:16px;outline:none;
      transition: border 0.2s;
    }
    input:focus,textarea:focus{border-color:var(--accent)}
    button.main{
      background:var(--accent);border:none;color:#fff;font-weight:600;padding:16px 28px;
      border-radius:var(--radius-full);cursor:pointer;width:100%;font-size:.95rem;
      transition: all 0.2s; box-shadow: 0 4px 12px rgba(0,113,227,0.3);
    }
    button.main:hover{ transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,113,227,0.4); }

    /* 音乐播放器 */
    .music-player{
      position:fixed;bottom:30px;right:30px;z-index:200;width:340px;
      background:var(--glass-bg);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
      border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;
      display:none;flex-direction:column;gap:14px;box-shadow:var(--shadow-md);
    }
    .music-player.show{display:flex}
    .music-player-toggle{
      position:fixed;bottom:30px;right:30px;z-index:201;width:50px;height:50px;
      border-radius:50%;background:var(--accent);border:none;color:#fff;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      box-shadow: 0 6px 20px rgba(0,113,227,0.5); transition: transform 0.2s;
    }
    .music-player-toggle:hover{transform:scale(1.08)}
    .music-info{display:flex;justify-content:space-between;align-items:center}
    .music-title{font-weight:600;font-size:.95rem}
    .music-artist{color:var(--text2);font-size:.8rem}
    .music-controls{display:flex;gap:8px;justify-content:center}
    .music-controls button{
      background:var(--surface2);border:1px solid var(--border);border-radius:10px;
      padding:8px 16px;color:var(--text);cursor:pointer;transition:all 0.2s;
      display:flex;align-items:center;justify-content:center;
    }
    .music-controls button:hover{background:var(--accent);color:#fff;transform:scale(1.05)}
    .music-track{width:100%}

    .svg-icon{transition: transform 0.2s, opacity 0.2s;}
    button:hover .svg-icon{transform: scale(1.12);}
    button:active .svg-icon{transform: scale(0.95);}

    .admin-toolbar { display: none; align-items: center; gap: 12px; margin-bottom: 20px; }
    .admin-toolbar.show { display: flex; }

    @media(max-width:768px){
      .nav{top:8px; width:calc(100% - 16px); height:48px; padding:0 12px;}
      .nav-icons{display:none}
      .mob-nav{display:flex}
      .hero{min-height:600px}
      .hero-caption h1{font-size:3.5rem}
      .main-wrap{padding:40px 16px 120px}
      .grid{columns:1}
      .music-player{width:280px;right:16px;bottom:90px}
      .music-player-toggle{bottom:90px;right:16px}
      .settings{width:280px;right:10px;top:70px}
    }
  </style>
</head>
<body>
<div class="bg-animation"></div>
<div id="loader"><div class="loader-ring"></div></div>

<!-- 登录遮罩 -->
<div id="authWrap" class="auth-overlay">
  <div class="auth-card" id="loginBox">
    <h2>OSKWK</h2>

// ==================== 视差滚动 + 导航栏效果 ====================
function setupParallax() {
  window.addEventListener('scroll', () => {
    const scrollY = window.scrollY;
    const heroImg = document.getElementById('heroBg');
    const heroCaption = document.getElementById('heroCaption');
    const nav = document.querySelector('.nav');
    if (heroImg) heroImg.style.transform = `translateY(${scrollY * 0.15}px)`;
    if (heroCaption) {
      const opacity = Math.max(0, 1 - scrollY / 600);
      heroCaption.style.opacity = opacity;
      heroCaption.style.transform = `translateY(${scrollY * 0.3}px)`;
    }
    if (nav) {
      if (scrollY > 50) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    }
  });
}

function loadTrack(index) {
  if (index < 0) index = playlist.length - 1;
  if (index >= playlist.length) index = 0;

  const track = playlist[index];
  document.getElementById('musicTitle').textContent = track.title;

  audio.src = track.src;
  if (isPlaying) audio.play().catch(() => {});
  updatePlayPauseIcon();
}
function togglePlay() {
  if (isPlaying) { audio.pause(); isPlaying = false; }

});
function formatTime(s) {
  if (isNaN(s)) return '0:00';

}

// ==================== 节日倒计时（单个最近节日+进度条） ====================
function renderCountdown() {
  const today = new Date();
  const year = today.getFullYear();
  const rawEvents = [
    { name: '元旦', month: 1, day: 1 },
    { name: '情人节', month: 2, day: 14 },
    { name: '劳动节', month: 5, day: 1 },
    { name: '中秋节', month: 9, day: 17 },
    { name: '国庆节', month: 10, day: 1 },
    { name: '圣诞节', month: 12, day: 25 }
  ];
  const eventsWithDiff = rawEvents.map(e => {
    let eventDate = new Date(year, e.month - 1, e.day);
    if (eventDate < today) eventDate = new Date(year + 1, e.month - 1, e.day);
    const diffDays = Math.ceil((eventDate - today) / (1000 * 60 * 60 * 24));
    return { ...e, diffDays };
  });
  const nextEvent = eventsWithDiff.reduce((min, curr) => curr.diffDays < min.diffDays ? curr : min, eventsWithDiff[0]);
  const daysInYear = 365;
  const elapsedDays = daysInYear - nextEvent.diffDays;
  const progressPercent = Math.min(100, Math.max(0, (elapsedDays / daysInYear) * 100));
  document.getElementById('countdownWidget').innerHTML = `
    <h3>节日倒计时</h3>
    <div class="countdown-item">
      <div class="days">${nextEvent.diffDays}</div>
      <div class="label">距${nextEvent.name}</div>
      <div class="progress-bar-container"><div class="progress-bar-fill" style="width:${progressPercent}%"></div></div>
    </div>`;
}

  for (const name of publicRooms) if (!kw || name.includes(kw)) html += `<button class="nav-icon" style="width:auto;padding:8px 16px" onclick="joinPublicRoom('${name}')"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> ${name}</button>`;
  for (const r of allRooms) if (!kw || r.name.toLowerCase().includes(kw)) html += `<button class="nav-icon" style="width:auto;padding:8px 16px" onclick="joinCustomRoom('${r.name.replace(/'/g, "\\'")}', ${r.password !== ''})"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg> ${r.name} ${r.password ? SVG_ICONS.lock : ''}</button>`;
  html += `<button class="nav-icon" style="width:auto;padding:8px 16px" onclick="startPrivateChat()"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg> 私信</button>`;
  list.innerHTML = html || '<p style="color:var(--text3)">没有匹配的房间</p>';
}
window.showCreateRoom = () => {
  let html = `<h3>创建房间</h3><input id="newRoomName" placeholder="房间名称"><input id="newRoomPass" type="password" placeholder="密码（可选）"><button class="main" onclick="createRoom()">创建</button>`;
  $('#genericContent').innerHTML = html;
  $('#genericModal').classList.add('show');
};
window.createRoom = async () => {
  const name = document.getElementById('newRoomName')?.value.trim(), pass = document.getElementById('newRoomPass')?.value.trim();
  if (!name) return T('请输入房间名称');
  if (['大厅', '技术', '理论', '艺术'].includes(name)) return T('不能与公共房间重名');
  const { error } = await supabase.from('rooms').insert([{ name, password: pass || '', created_by: user.email }]);
  if (error) return T('创建失败');
  T('房间已创建');
  $('#genericModal').classList.remove('show');
  renderRoomList();
};
window.joinPublicRoom = name => { if (!user) return T('请登录'); room = 'oskwk-' + name; startChat(); };
window.joinCustomRoom = async (name, hasPass) => {
  if (!user) return T('请登录');
  if (hasPass) {
    const pass = prompt('请输入房间密码：');
    if (pass === null) return;
    const { data, error } = await supabase.from('rooms').select('password').eq('name', name).single();
    if (error) return T('验证失败');
    if (String(data.password) !== String(pass)) return T('密码错误');
  }
  room = 'oskwk-' + name;
  startChat();
};
window.startPrivateChat = () => {
  if (!user) return T('请先登录');
  const peer = prompt('对方邮箱');
  if (!peer) return;
  room = 'private-' + [user.email, peer].sort().join('_');
  startChat();
};
async function startChat() {
  document.getElementById('roomList').style.display = 'none';
  document.getElementById('chatPanel').style.display = 'block';
  const { data } = await supabase.from('messages').select('*').eq('room', room).order('created_at', { ascending: true }).limit(200);
  const log = document.getElementById('chatLog');
  log.innerHTML = '';
  if (data) data.forEach(renderMsg);
  if (realtime) supabase.removeChannel(realtime);
  realtime = supabase.channel('room-' + room)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room=eq.${room}` }, payload => renderMsg(payload.new))
    .subscribe();
}
function renderMsg(m) {
  const log = document.getElementById('chatLog');
  if (!log) return;
  const isMine = m.nickname === user?.nickname;
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ' + (isMine ? 'mine' : 'peer');
  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'msg-avatar';
  avatarDiv.textContent = m.nickname?.charAt(0) || '?';
  const bodyDiv = document.createElement('div');
  bodyDiv.className = 'msg-body';
  bodyDiv.innerHTML = `<b>${m.nickname}</b><br>${m.message || ''}${m.image_url ? `<br><img src="${m.image_url}" style="max-width:200px;border-radius:8px" onerror="this.style.display='none'">` : ''}`;
  const timeSpan = document.createElement('div');
  timeSpan.className = 'msg-time';
  timeSpan.textContent = new Date(m.created_at).toLocaleTimeString();
  bodyDiv.appendChild(timeSpan);
  msgDiv.appendChild(avatarDiv);
  msgDiv.appendChild(bodyDiv);
  log.appendChild(msgDiv);
  log.scrollTop = log.scrollHeight;
}
window.sendMsg = async () => {
  const inp = document.getElementById('msgInput'), txt = inp.value.trim();
  if (!user) return T('请先登录');
  if (!room) return T('请先进入聊天室');
  if (!txt) return;
  const { data, error } = await supabase.from('messages').insert([{ room, nickname: user.nickname, message: txt }]).select();
  if (error) return T('发送失败');
  if (data && data[0]) renderMsg(data[0]);
  inp.value = '';
};
window.uploadImg = async () => {
  const f = document.getElementById('imgUpload').files[0];
  if (!user) return T('请先登录');
  if (!room) return T('请先进入聊天室');
  if (!f) return;
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d'), img = new Image();
  img.src = URL.createObjectURL(f); await new Promise(r => img.onload = r);
  let w = img.width, h = img.height; if (w > 800) { h *= 800/w; w = 800; }
  canvas.width = w; canvas.height = h; ctx.drawImage(img, 0, 0, w, h);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.7));
  const name = `chat_${Date.now()}.jpg`;
  const { error: uploadError } = await supabase.storage.from('chat-images').upload(name, blob);
  if (uploadError) return T('图片上传失败');
  const url = `${SUPABASE_URL}/storage/v1/object/public/chat-images/${name}`;
  const { data, error: insertError } = await supabase.from('messages').insert([{ room, nickname: user.nickname, image_url: url }]).select();
  if (insertError) return T('发送失败');
  if (data && data[0]) renderMsg(data[0]);
  document.getElementById('imgUpload').value = '';
};
window.leaveRoom = () => {
  if (realtime) supabase.removeChannel(realtime);
  room = null;
  document.getElementById('chatPanel').style.display = 'none';
  document.getElementById('roomList').style.display = 'flex';
};

// ==================== 动态/好友 ====================
window.openPost = () => {
  $('#genericContent').innerHTML = `<textarea id="postText" placeholder="分享风景..."></textarea><input type="file" id="postFile" accept="image/*"><button class="main" onclick="submitPost()">发布</button>`;
  $('#genericModal').classList.add('show');
};
window.submitPost = async () => {
  const txt = document.getElementById('postText')?.value.trim(), file = document.getElementById('postFile')?.files[0];
  let url = null;
  if (file) {
    const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d'), img = new Image();
    img.src = URL.createObjectURL(file); await new Promise(r => img.onload = r);
    let w = img.width, h = img.height; if (w > 800) { h *= 800/w; w = 800; }
    canvas.width = w; canvas.height = h; ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.7));
    const name = `post_${Date.now()}.jpg`;
    await supabase.storage.from('chat-images').upload(name, blob);
    url = `${SUPABASE_URL}/storage/v1/object/public/chat-images/${name}`;
  }
  await supabase.from('posts').insert([{ email: user.email, nickname: user.nickname, content: txt || '', image_url: url }]);
  T('已发布'); $('#genericModal').classList.remove('show'); loadFeed();
};
async function loadFeed() {
  if (!user) return;
  const { data: friends } = await supabase.from('friendships').select('*').or(`from_email.eq.${user.email},to_email.eq.${user.email}`).eq('status', 'accepted');
  const emails = [user.email, ...(friends || []).map(f => f.from_email === user.email ? f.to_email : f.from_email)];
  const { data: posts } = await supabase.from('posts').select('*').in('email', emails).order('created_at', { ascending: false }).limit(30);
  document.getElementById('friendsFeed').innerHTML = (posts || []).map(p => `
    <div class="card">
      <div class="card-body"><b>${p.nickname}</b> ${p.content || ''}</div>
      ${p.image_url ? `<img src="${p.image_url}" style="width:100%" onerror="this.style.display='none'">` : ''}
    </div>
  `).join('') || '<p style="color:var(--text3)">暂无动态</p>';
}
window.showRequests = async () => {
  const { data } = await supabase.from('friendships').select('*').eq('to_email', user.email).eq('status', 'pending');
  let html = '<h3>好友请求</h3>';
  if (data?.length) data.forEach(r => html += `<p>${r.from_email} <button onclick="handleReq(${r.id},'accepted')">接受</button> <button onclick="handleReq(${r.id},'rejected')">拒绝</button></p>`);
  else html += '<p>暂无</p>';
  $('#genericContent').innerHTML = html;
  $('#genericModal').classList.add('show');
};
window.handleReq = async (id, status) => {
  await supabase.from('friendships').update({ status }).eq('id', id);
  T('已处理'); window.showRequests();
};
window.addFriend = () => {
  const email = prompt('对方邮箱');
  if (email) supabase.from('friendships').insert([{ from_email: user.email, to_email: email }]).then(() => T('已发送'));
};

// ==================== 个人资料 ====================
async function renderProfile() {
  if (!user) return;
  const sig = user.signature ? `<div class="signature-box">“${user.signature}”</div>` : '';
  const html = `
    <div class="card" style="text-align:center;padding:28px">
      <div class="avatar" style="width:64px;height:64px;font-size:1.6rem;margin:0 auto 16px">${user.nickname?.charAt(0)}</div>
      <h3>${user.nickname}</h3><p style="color:var(--text2)">${user.email}</p>
      ${sig}
      <button onclick="showRequests()">好友请求</button>
      <button onclick="addFriend()">添加好友</button>
      <button onclick="showEditProfile()">编辑资料</button>
      <button onclick="searchUser()">搜索用户</button>
      ${isAdmin ? '<button onclick="showAdmin()">用户管理</button>' : ''}
      <button onclick="logout()">退出</button>
    </div>
  `;
  document.getElementById('profileArea').innerHTML = html;
}
window.showEditProfile = () => {
  let html = `<h3>编辑资料</h3><input id="editNick" placeholder="新昵称" value="${user.nickname || ''}"><input id="editPass" type="password" placeholder="新密码（留空不变）"><input id="editAvatar" placeholder="头像URL"><input id="editSignature" placeholder="个性签名" value="${user.signature || ''}"><button class="main" onclick="saveProfile()">保存</button>`;
  $('#genericContent').innerHTML = html;
  $('#genericModal').classList.add('show');
};
window.saveProfile = async () => {
  const nick = document.getElementById('editNick')?.value.trim(), pass = document.getElementById('editPass')?.value.trim(), avatar = document.getElementById('editAvatar')?.value.trim(), sig = document.getElementById('editSignature')?.value.trim() || '';
  if (!nick) return T('昵称不能为空');
  const { data, error } = await supabase.rpc('update_profile', { user_email: user.email, new_nickname: nick, new_password: pass || null, new_avatar_url: avatar || null, new_signature: sig });
  if (error) return T('更新失败');
  user = data[0];
  localStorage.setItem('oskwk_user', JSON.stringify(user));
  T('资料已更新'); $('#genericModal').classList.remove('show'); renderProfile();
  document.getElementById('avatarTxt').textContent = user.nickname?.charAt(0)?.toUpperCase() || '?';
  if (user.avatar_url) { document.getElementById('avatarBtn').style.backgroundImage = `url(${user.avatar_url})`; document.getElementById('avatarTxt').textContent = ''; }
};
window.searchUser = () => {
  let html = `<h3>搜索用户</h3><input id="searchKeyword" placeholder="邮箱或昵称"><button class="main" onclick="doSearch()">搜索</button><div id="searchResult"></div>`;
  $('#genericContent').innerHTML = html;
  $('#genericModal').classList.add('show');
};
window.doSearch = async () => {
  const kw = document.getElementById('searchKeyword')?.value.trim();
  if (!kw) return T('请输入关键词');
  const { data, error } = await supabase.from('profiles').select('email, nickname, avatar_url, signature').or(`email.ilike.%${kw}%,nickname.ilike.%${kw}%`).limit(10);
  if (error) return T('搜索失败');
  const list = document.getElementById('searchResult');
  if (data && data.length) list.innerHTML = data.map(u => `<p><b>${u.nickname}</b> (${u.email}) ${u.signature ? '“'+u.signature+'”' : ''} <button onclick="addFriendByEmail('${u.email}')">加好友</button></p>`).join('');
  else list.innerHTML = '<p>未找到用户</p>';
};
window.addFriendByEmail = (email) => {
  if (email === user.email) return T('不能添加自己');
  supabase.from('friendships').insert([{ from_email: user.email, to_email: email }]).then(() => T('请求已发送'));
};
window.showAdmin = async () => {
  if (!isAdmin) return T('无权操作');
  const { data } = await supabase.from('profiles').select('*');
  let html = '<h3>用户管理</h3>';
  data.forEach(u => html += `<p>${u.nickname} (${u.email}) ${u.is_banned ? '[BANNED]' : ''} <button onclick="toggleBan('${u.email}',${!u.is_banned})">${u.is_banned ? '解禁' : '拉黑'}</button></p>`);
  $('#genericContent').innerHTML = html;
  $('#genericModal').classList.add('show');
};
window.toggleBan = async (email, ban) => {
  if (!isAdmin) return;
  await supabase.from('profiles').update({ is_banned: ban }).eq('email', email);
  T('已更新'); window.showAdmin();
};

// ==================== 通知 ====================
async function fetchNotifs() {
  if (!user) return;
  const { data } = await supabase.from('notifications').select('*').eq('user_email', user.email).order('created_at', { ascending: false }).limit(20);
  const unread = data?.filter(n => !n.read).length || 0;
  const dot = document.getElementById('notifDot');
  if (dot) dot.style.display = unread ? 'block' : 'none';
  return data;
}
window.showNotifs = async () => {
  const data = await fetchNotifs();
  let html = '<h3>通知</h3>';
  if (data?.length) data.forEach(n => html += `<p>${n.content} <small>${new Date(n.created_at).toLocaleString()}</small></p>`);
  else html += '<p>暂无</p>';
  $('#genericContent').innerHTML = html;
  $('#genericModal').classList.add('show');
  await supabase.from('notifications').update({ read: true }).eq('user_email', user.email).eq('read', false);
};
function subNotifs() {
  if (!user) return;
  if (notifSub) supabase.removeChannel(notifSub);
  notifSub = supabase.channel('notif-' + user.email)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_email=eq.${user.email}` }, () => fetchNotifs())
    .subscribe();
}
window.logout = () => { localStorage.removeItem('oskwk_user'); location.reload(); };

(() => {
  const saved = localStorage.getItem('oskwk_user');
  if (saved) {
    try { user = JSON.parse(saved); isAdmin = (user.email === ADMIN_EMAIL); enter(); }
    catch (e) { localStorage.removeItem('oskwk_user'); }
  } else { document.getElementById('authWrap').style.display = 'flex'; }
  setTimeout(() => document.getElementById('loader').classList.add('done'), 600);

  const fontSize = localStorage.getItem('oskwk_fontsize'); if (fontSize) updateFontSize(fontSize);
  const accent = localStorage.getItem('oskwk_accent'); if (accent) document.documentElement.style.setProperty('--accent', accent);
})();
